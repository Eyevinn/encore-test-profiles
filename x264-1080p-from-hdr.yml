name: x264-1080p-from-hdr
description: Program profile, tone-maps an HDR (PQ/HLG) source down to 8-bit SDR bt709
scaling: bicubic
encodes:
  - type: X264Encode
    suffix: _x264_3100
    twoPass: true
    height: 1080
    params:
      b:v: 3100k
      maxrate: 4700k
      bufsize: 6200k
      r: 25
      fps_mode: cfr
      pix_fmt: yuv420p
      colorspace: bt709
      color_primaries: bt709
      color_trc: bt709
      force_key_frames: expr:not(mod(n,96))
      preset: medium
    filters:
      - zscale=t=linear:npl=100,tonemap=hable,zscale=t=bt709:m=bt709:r=tv,format=yuv420p
